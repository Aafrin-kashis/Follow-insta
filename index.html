<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Code with Kashis</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: white;
}

/* MAIN SCENE */

.scene {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;

    background: linear-gradient(
        180deg,
        #ffffff 0%,
        #faf5ff 70%,
        #f3e8ff 100%
    );
}

/* BACKGROUND GLOW */

.glow {
    position: absolute;
    width: 400px;
    height: 400px;
    top: 25%;
    left: 50%;
    transform: translateX(-50%);

    background: #d8b4fe;
    filter: blur(110px);
    opacity: .35;

    pointer-events: none;
}

/* LOGO */

.logo {
    position: absolute;
    top: 25px;
    left: 30px;

    display: flex;
    align-items: center;
    gap: 12px;

    font-size: 23px;
    font-weight: 800;
    color: #7c3aed;

    z-index: 10;
}

.logo img {
    width: 55px;
    height: 55px;
    object-fit: contain;
}

.logo span {
    color: #ec4899;
}

@media (max-width: 600px) {
    .logo {
        top: 15px;
        left: 15px;
        font-size: 17px;
        gap: 8px;
    }

    .logo img {
        width: 40px;
        height: 40px;
    }
}

/* REPLAY BUTTON */

.replay {
    position: absolute;
    top: 20px;
    right: 20px;

    border: none;
    border-radius: 30px;
    padding: 10px 18px;

    background: #f3e8ff;
    color: #7c3aed;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;
    z-index: 20;
}

/* HEADING */

.heading {
    position: absolute;
    top: 18%;
    left: 0;
    width: 100%;

    padding: 0 15px;

    text-align: center;
    font-size: clamp(24px, 4vw, 44px);
    font-weight: 800;
    color: #3b0764;
}

.heading span {
    color: #9333ea;
}

/* FOLLOW BUTTON */

.follow-btn {
    position: absolute;

    top: 60%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: min(65%, 370px);
    height: 90px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;

    border: 5px solid #c4b5fd;
    border-radius: 60px;

    background: linear-gradient(
        110deg,
        #7c3aed,
        #c026d3,
        #ec4899
    );

    color: white;
    font-size: 32px;
    font-weight: bold;

    box-shadow:
        0 0 20px #c084fc,
        0 0 45px #e9d5ff;

    z-index: 3;

    transition:
        background .4s,
        box-shadow .4s,
        border-color .4s;
}

/* CLICKED BUTTON */

.follow-btn.clicked {
    background: linear-gradient(
        110deg,
        #059669,
        #10b981
    );

    border-color: #a7f3d0;

    box-shadow:
        0 0 25px #6ee7b7,
        0 0 50px #a7f3d0;
}

.arrow {
    font-size: 35px;
}

/* BUTTON RIPPLE */

.ripple {
    position: absolute;
    inset: 0;

    border: 3px solid white;
    border-radius: 60px;

    opacity: 0;
    pointer-events: none;
}

.follow-btn.clicked .ripple {
    animation: ripple .8s ease-out;
}

@keyframes ripple {
    0% {
        transform: scale(1);
        opacity: .8;
    }

    100% {
        transform: scale(1.5);
        opacity: 0;
    }
}

/* GIRL ON LEFT SIDE */

.girl {
    position: absolute;

    width: 280px;
    height: 420px;

    left: 2%;
    right: auto;
    bottom: 0;

    z-index: 5;

    display: flex;
    align-items: flex-end;
    justify-content: center;

    opacity: 0;
    transform: translateX(-300px);
}

/* GIRL IMAGE */

.girl img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
    object-position: bottom;

    user-select: none;
    -webkit-user-drag: none;
}

/* GIRL ENTERS FROM LEFT */

.girl.enter {
    animation: girlEnter 1.5s ease-out forwards;
}

@keyframes girlEnter {
    0% {
        transform: translateX(-300px);
        opacity: 0;
    }

    100% {
        transform: translateX(0);
        opacity: 1;
    }
}

/* SPEECH BUBBLE */

.bubble {
    position: absolute;

    top: 38%;
    right: -65px;

    padding: 13px 18px;

    background: white;
    color: #7c3aed;

    border-radius: 20px;

    font-size: 16px;
    font-weight: bold;
    white-space: nowrap;

    box-shadow: 0 5px 25px #d8b4fe;

    opacity: 0;
    transform: translateY(10px);

    z-index: 10;
}

.bubble.show {
    animation: bubbleIn .5s ease forwards;
}

@keyframes bubbleIn {
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* SPARKLES */

.sparkle {
    position: absolute;

    font-size: 30px;
    color: #a855f7;

    opacity: 0;
    pointer-events: none;

    z-index: 8;
}

.sparkle.show {
    animation: sparkle .9s ease-out;
}

@keyframes sparkle {
    0% {
        opacity: 0;
        transform: scale(0) rotate(0deg);
    }

    50% {
        opacity: 1;
        transform: scale(1.5) rotate(90deg);
    }

    100% {
        opacity: 0;
        transform: scale(.5) rotate(180deg);
    }
}

/* BOTTOM TEXT */

.bottom-text {
    position: absolute;
    bottom: 25px;
    left: 0;
    width: 100%;

    padding: 0 15px;

    text-align: center;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: .5px;

    color: #7e22ce;
}

/* MOBILE RESPONSIVE */

@media (max-width: 600px) {

    .logo {
        top: 20px;
        left: 15px;
        font-size: 17px;
    }

    .replay {
        top: 65px;
        right: 15px;
        padding: 8px 13px;
    }

    .heading {
        top: 23%;
        font-size: 25px;
    }

    .follow-btn {
        top: 40%;
        width: 65%;
        height: 68px;

        font-size: 24px;
        gap: 10px;

        border-width: 4px;
    }

    .arrow {
        font-size: 27px;
    }

    /* Girl stays on LEFT */

    .girl {
        width: 190px;
        height: 300px;

        left: -5px;
        right: auto;
    }

    .bubble {
        top: 5%;
        right: -55px;

        padding: 10px 13px;
        font-size: 13px;
    }

    .bottom-text {
        bottom: 20px;
        font-size: 12px;
        line-height: 1.5;
    }
}

/* SMALL PHONES */

@media (max-width: 380px) {

    .girl {
        width: 165px;
        height: 260px;

        left: -8px;
        right: auto;
    }

    .follow-btn {
        width: 68%;
        font-size: 21px;
    }

    .heading {
        font-size: 22px;
    }
}

</style>
</head>

<body>

<div class="scene">

    <!-- Background Glow -->

    <div class="glow"></div>

    <!-- Logo -->

    <div class="logo">
    <img src="ck-logo.png" alt="CK Logo">
    <span>Code with Kashis</span>
</div>

    <!-- Replay -->

    <button class="replay" id="replayBtn">
        Replay ↻
    </button>

    <!-- Heading -->

    <h1 class="heading">
        Follow Me For
        <span>More Coding!</span>
    </h1>

    <!-- Follow Button -->

    <div class="follow-btn" id="followBtn">

        <span id="btnText">Follow</span>

        <span class="arrow" id="arrow">➜</span>

        <div class="ripple"></div>

    </div>

    <!-- GIRL ON LEFT SIDE -->

    <div class="girl" id="girl">

        <div class="bubble" id="bubble">
            Let's Follow!
        </div>

        <img
            src="girl.png"
            alt="Cute cartoon girl - Code with Kashis"
        >

    </div>

    <!-- Sparkles -->

    <div class="sparkle"
         id="sparkle1"
         style="top:35%;left:18%">
        ✦
    </div>

    <div class="sparkle"
         id="sparkle2"
         style="top:48%;left:30%">
        ✧
    </div>

    <div class="sparkle"
         id="sparkle3"
         style="top:30%;right:25%">
        ✦
    </div>

    <!-- Bottom Text -->

    <div class="bottom-text">
        Follow Code with Kashis for more coding content
    </div>

</div>

<script>

/* YOUR PROFILE LINK */

const profileURL = "https://www.instagram.com/codewithkashis?stkn=c2d4OGFjZGx5bGIy";


/* ELEMENTS */

const girl = document.getElementById("girl");

const button = document.getElementById("followBtn");

const btnText = document.getElementById("btnText");

const arrow = document.getElementById("arrow");

const bubble = document.getElementById("bubble");

const replayBtn = document.getElementById("replayBtn");

const sparkles = document.querySelectorAll(".sparkle");


/* TIMER STORAGE */

let timers = [];


/* SCHEDULE FUNCTION */

function later(callback, delay) {

    const timer = setTimeout(callback, delay);

    timers.push(timer);

}


/* CLEAR TIMERS */

function clearTimers() {

    timers.forEach(timer => {
        clearTimeout(timer);
    });

    timers = [];

}


/* RESET ANIMATION */

function resetAnimation() {

    clearTimers();

    girl.classList.remove("enter");

    button.classList.remove("clicked");

    bubble.classList.remove("show");

    sparkles.forEach(sparkle => {
        sparkle.classList.remove("show");
    });

    btnText.textContent = "Follow";

    arrow.textContent = "➜";

    girl.style.opacity = "0";

    girl.style.transform = "translateX(-300px)";

}


/* START ANIMATION */

function startAnimation() {

    resetAnimation();

    /* 1. Girl enters from LEFT */

    later(() => {

        girl.classList.add("enter");

    }, 500);


    /* 2. Girl speech bubble */

    later(() => {

        bubble.classList.add("show");

    }, 2000);


    /* 3. Follow button click effect */

    later(() => {

        button.classList.add("clicked");

        btnText.textContent = "Following";

        arrow.textContent = "✓";

        /* Sparkle animation */

        sparkles.forEach(sparkle => {

            sparkle.classList.remove("show");

            void sparkle.offsetWidth;

            sparkle.classList.add("show");

        });

    }, 4000);


    /* 4. Open profile */

    later(() => {

        if (profileURL !== "YOUR_PROFILE_LINK") {

            window.location.href = profileURL;

        }

    }, 6000);

}


/* REPLAY */

replayBtn.addEventListener("click", () => {

    startAnimation();

});


/* START WHEN PAGE LOADS */

window.addEventListener("load", () => {

    startAnimation();

});

</script>

</body>
</html>
